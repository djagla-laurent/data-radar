name: Collecte et publication
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @xmldom/xmldom@0.9.12 js-yaml@5.5.0
      - run: node collect.mjs
      - id: hour
        run: echo "h=$(date -u +%H)" >> "$GITHUB_OUTPUT"
      - name: Envoyer le résumé du matin par e-mail
        if: env.SMTP_SERVER != '' && env.DIGEST_TO != '' && (github.event_name == 'workflow_dispatch' || steps.hour.outputs.h == '06' || steps.hour.outputs.h == '07')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Data Radar · résumé du jour
          to: ${{ secrets.DIGEST_TO }}
          from: Data Radar <${{ secrets.SMTP_USERNAME }}>
          html_body: file://data/digest.html
      - run: |
          mkdir -p _site/data
          cp index.html app.js sources.js styles.css _site/
          cp data/items.json data/items.js _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
